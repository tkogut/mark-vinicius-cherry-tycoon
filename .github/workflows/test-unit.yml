name: Unit Tests (lint + typecheck + vitest)

# Fast gate — no dfx, no replica, no browser, no credentials. Runs on every
# push and PR because it finishes in about a minute.
#
# Covers layers L1/L1b/L2 of the test pyramid (see .planning/REQUIREMENTS.md
# QUAL-*): pure game logic, TS<->Motoko economic-formula parity, phase-gate
# parity, and the Candid contract guard. The live-replica integration test in
# src/__tests__/backend_integration.test.ts self-skips here (it needs
# RUN_INTEGRATION plus a running canister) and is covered by
# test-backend-logic.yml instead.
#
# Deliberately does NOT touch deploy-playground.yml / deploy-mainnet.yml, which
# must keep working unchanged (see CLAUDE.md).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    name: lint, typecheck, vitest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `lint` enforces 0 errors and caps warnings via --max-warnings, which
      # acts as a ratchet on pre-existing debt (QUAL-04). If this step fails on
      # the warning count, pay debt down or fix the new warning — do not raise
      # the ceiling in package.json to make it pass.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
