name: E2E Tests (Playwright, dev harnesses)

# Layer L4 of the test pyramid (QUAL-03). Drives the real components through the
# deterministic dev harnesses (frontend/harness.html and
# frontend/marketplace-harness.html), which mock their props and need no auth,
# no canister and no credentials.
#
# Scope is deliberate: full-journey coverage against a live replica is a
# separate, later piece of work (QUAL-10). Driving the full app was tried by
# hand during the UX work and was flaky for reasons unrelated to the code under
# test — a random weather-event modal intercepts clicks and test-player
# initialisation intermittently fails. Those are gameplay behaviours, not bugs
# to assert around, so they are kept out of the always-on gate.
#
# Runs on PRs (where regressions must be caught) and nightly (to notice rot in
# a branch nobody is touching), but not on every push — a browser run is ~15s of
# test time plus a couple of minutes of browser install.
#
# Does not touch deploy-playground.yml / deploy-mainnet.yml (see CLAUDE.md).

on:
  pull_request:
  schedule:
    # 03:17 UTC — an off-the-hour minute, so this does not pile onto the
    # top-of-hour spike on GitHub's shared runners.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Playwright (harnesses)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only chromium — the harness specs assert on canvas pixel data and
      # computed z-index, which is engine-independent. Adding webkit/firefox
      # would triple the runtime for no extra signal at this layer.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the vite dev server itself via `webServer`,
      # so there is no separate start/stop step here.
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
